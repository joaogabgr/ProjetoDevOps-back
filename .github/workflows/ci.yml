name: CI

# Verificação de todo PR e de todo merge (RNF3). Os jobs titulo, typecheck, testes
# e build são verificações obrigatórias nas branches develop, homolog e main.
on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [develop, homolog, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:test

  build:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
